project:
  type: website
  render:
    - index.qmd
    - map.qmd
    - labs/*.qmd
    - ai/*.qmd

lang: ko

website:
  title: "OSSO 실습"
  site-url: https://kreonet.github.io/osso/lab/
  repo-url: https://github.com/KREONET/osso
  repo-subdir: lab
  repo-actions: [edit, issue]
  search: true
  open-graph:
    image: https://kreonet.github.io/osso/cards/og-osso.png
  page-navigation: true
  navbar:
    left:
      - text: "실습"
        href: index.qmd
      - text: "지도"
        href: map.qmd
      - text: "책"
        href: ../book/index.html
      - text: "슬라이드"
        href: ../slide/index.html
  sidebar:
    style: docked
    contents:
      - index.qmd
      - map.qmd
      - section: "Day 1 — 머신·방화벽·VPN·원격 접속"
        contents:
          - labs/00-lab-intro.qmd
          - labs/lab-01.qmd
          - labs/lab-02.qmd
          - labs/lab-03.qmd
          - labs/lab-04.qmd
          - labs/lab-05.qmd
          - labs/lab-06.qmd
          - labs/lab-07.qmd
          - labs/lab-08.qmd
      - section: "Day 2 — 서비스·인증서·인증·AI"
        contents:
          - labs/lab-09.qmd
          - labs/lab-09p.qmd
          - labs/lab-10.qmd
          - labs/lab-11.qmd
          - labs/lab-12.qmd
          - labs/lab-13.qmd
          - labs/lab-14.qmd
      - section: "AI로 내 교재 만들기"
        contents:
          - ai/index.qmd
          - ai/route.qmd
          - ai/review.qmd
          - ai/my-task.qmd
          - ai/audio.qmd
          - ai/cards.qmd

filters:
  - ../shared/filters/crosslink.lua

format:
  html:
    theme:
      light: [cosmo, ../shared/styles/osso.scss]
      dark: [darkly, ../shared/styles/osso.scss]
    highlight-style: github
    code-copy: true
    toc: true
    toc-title: "이 페이지의 차례"
    mermaid:
      theme: neutral
